name: Update portfolio project order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move new projects into the middle and fix image names
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def extract_card(source, title):
              marker = f'data-project-title="{title}"'
              pos = source.find(marker)
              if pos == -1:
                  return None, source
              start = source.rfind('<div class="project-card"', 0, pos)
              if start == -1:
                  return None, source
              depth = 0
              i = start
              tag_re = re.compile(r'<div\b|</div\s*>', re.I)
              end = None
              for m in tag_re.finditer(source, start):
                  if m.group().lower().startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          end = m.end()
                          break
              if end is None:
                  return None, source
              card = source[start:end]
              source = source[:start] + source[end:]
              return card.strip('\n'), source

          cards = []
          for title in ['Karak & Co Café', 'Fiz Handyman']:
              card, text = extract_card(text, title)
              if card:
                  if title == 'Karak & Co Café':
                      card = card.replace('images/karak-and-co.png', 'images/cafe.png')
                  if title == 'Fiz Handyman':
                      card = re.sub(r'images/[^"\']+', 'images/fiz.png', card)
                  cards.append((title, card))

          # Insert the two newer projects after House of Payam so they appear in the middle,
          # rather than leading the portfolio grid.
          if cards:
              anchor_title = 'House of Payam'
              marker = f'data-project-title="{anchor_title}"'
              pos = text.find(marker)
              if pos != -1:
                  start = text.rfind('<div class="project-card"', 0, pos)
                  depth = 0
                  end = None
                  tag_re = re.compile(r'<div\b|</div\s*>', re.I)
                  for m in tag_re.finditer(text, start):
                      if m.group().lower().startswith('<div'):
                          depth += 1
                      else:
                          depth -= 1
                          if depth == 0:
                              end = m.end()
                              break
                  if end:
                      insertion = '\n\n' + '\n\n'.join(card for _, card in cards)
                      text = text[:end] + insertion + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix portfolio project images and ordering"
          git push
          git rm .github/workflows/portfolio-project-order-fix.yml
          git commit -m "Remove temporary portfolio update workflow"
          git push
